name: Homebrew CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/update_formulas.py --check
      - run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Intel has no new Homebrew bottles; allow real dependency builds to finish.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 360 || 90 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
      - name: Check formula style
        run: |
          python3 - <<'PY'
          import json, subprocess
          names = json.load(open('packaging/projects.json'))
          subprocess.run(['brew', 'style', *[f'Formula/{name}.rb' for name in names]], check=True)
          PY
      - name: Install and test managed formulas
        run: python3 scripts/test_install.py
  linux-floor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    container: debian:12
    timeout-minutes: 15
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends python3 ca-certificates git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run native release binaries on Debian 12
        run: python3 scripts/check_linux_assets.py
